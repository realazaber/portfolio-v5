<div class="section bg-gradient-to-b from-white to-blue-50">
  <eui-section id="portfolio">
    <eui-container>
      <h2>Notable works</h2>
      <eui-grid [cols]="1" [smCols]="2" [mdCols]="3" [gap]="4">
        @for (project of projects; track project.id) {
          <app-main-project [project]="project"></app-main-project>
        }
      </eui-grid>
      <a routerLink="/more-projects" class="mt-3 text-primary underline">
        Other projects
      </a>
    </eui-container>
  </eui-section>
</div>
